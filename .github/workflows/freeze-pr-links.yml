---
name: Freeze PR links

# This repository runs its own action, from the default branch. `pull_request_target`
# loads this workflow from the default branch, and the checkout below takes the action
# from there too, never from the pull request.

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request whose head-branch links to freeze
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: freeze-pr-links-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    steps:
      - name: Check out the action from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Freeze the links
        uses: ./
        with:
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
