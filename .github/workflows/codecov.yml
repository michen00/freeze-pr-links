---
name: Codecov

# Uploads main's coverage for the README badge. Not a CI job, because
# tests/test_workflows.py keeps `id-token: write` out of CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    name: Upload coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: '3.13'
      - run: uv sync --locked --group test
      - run: uv run --no-sync python -m pytest --cov --cov-report=xml:coverage.xml
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
