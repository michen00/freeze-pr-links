---
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Arming needs no human action, so the `do not auto-merge` label is the only way to
    # withhold it.
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'do not auto-merge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      # fetch-metadata v3 or newer reports update-type even for pre-commit, whose metadata
      # trailer omits it. This step reports a pull request whose metadata still has none,
      # instead of leaving it unarmed without notice.
      - name: Report metadata that cannot be gated on
        if: ${{ !steps.meta.outputs.update-type }}
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: >-
          echo "::notice::No update-type in Dependabot metadata for
          ${ECOSYSTEM:-unknown}; leaving this PR for a human."
      - name: Check that the base branch requires CI
        id: gate
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch'
          || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONTEXT: Run CI (3.13)
        run: |
          set -euo pipefail
          required="$(gh api "repos/${REPO}/rules/branches/${BASE_REF}?per_page=100" \
            --jq '[.[] | select(.type == "required_status_checks")
              | .parameters.required_status_checks[].context]' \
            | jq --arg c "$CONTEXT" 'index($c) != null')"
          echo "required=${required}" >> "$GITHUB_OUTPUT"
          if [ "$required" != true ]; then
            echo "::notice::No ruleset on ${BASE_REF} requires '${CONTEXT}', so" \
              "auto-merge would not wait for CI; leaving this PR for a human."
          fi
      # The job's `if:` read the labels when the event fired. A `do not auto-merge` label
      # added since then starts a disarm run, which can finish before this step arms, so
      # the labels are read again before arming and after it. A failed read before
      # arming fails the step, a failed read after it disarms, and any value other than
      # `false` counts as held.
      - name: Enable auto-merge for patch and minor updates
        if: ${{ steps.gate.outputs.required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          held() {
            gh pr view "$PR_URL" --json labels \
              --jq 'any(.labels[]; .name == "do not auto-merge")'
          }
          before="$(held)"
          if [ "$before" != false ]; then
            echo "::notice::'do not auto-merge' is set; leaving this PR for a human."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
          after="$(held)" || after=unread
          if [ "$after" != false ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "::notice::After arming, 'do not auto-merge' read as ${after}; disarmed."
          fi

  disarm:
    # Arming happens when the pull request opens, before anyone can label it, so a
    # `do not auto-merge` label added later has to disarm it. There is no author check:
    # this job must reach every pull request the auto-merge job can arm, and disarming
    # one that was never armed does nothing.
    if: >-
      ${{ github.event.action == 'labeled'
      && github.event.label.name == 'do not auto-merge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge if it is armed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')"
          if [ "$armed" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
          echo "auto-merge is off on $PR_URL"
