[pytest]
addopts = ['-ra', '--strict-config', '--strict-markers', '--cov']
filterwarnings = ['error', 'ignore::DeprecationWarning']
log_cli_level = 'INFO'
markers = [
  "no_ci: marks tests that should not run in CI (deselect with '-m \"not no_ci\"')",
]
minversion = '9.0'
testpaths = ['tests']
xfail_strict = true
